<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP</title>

    <!-- Extra fonts & stuff -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    <!-- Required imports -->

    <link rel="stylesheet" href="build/css/style.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <!-- <script src="build/js/otp.min.js"></script> -->
    <script src="src/js/otp.js"></script>

    <script>
        $(function () {

            $('#otp-container').OTP({
                fetch: {
                    requestOTP: {
                        url: 'http://localhost:3001/api/request.json',
                        options: {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: {
                                firstName: 'Peter',
                                lastName: 'Raditsas',
                                age: 39
                            }
                        },
                        onRequest: function (res, err) {

                            if (err) {
                                
                                this.setErrorMessage('Unexpected Request Error');

                                return false;

                            } else {
                                
                                return true;

                            }

                        }
                    },
                    validateOTP: {
                        url: 'http://localhost:3001/api/validate.json',
                        options: {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: {
                                firstName: 'Peter',
                                lastName: 'Raditsas',
                                age: 39
                            }
                        },
                        onValidate: function (res, err) {
                            
                            if (err) {
                            
                                this.setErrorMessage('Unexpected Validation Error');
                            
                                return false;
                            
                            } else if (res.result !== true) {
                            
                                this.setErrorMessage('Invalid token provided');
                            
                                return false;
                            
                            } else {

                                return true;

                            }

                        }
                    }
                },
                events: {
                    onCancelClick: function (evt, instance) {

                        evt.preventDefault();

                        instance.hide();

                    }
                }
            });

            window.otp = $('#otp-container').data('otp');

        })    
    </script>
</head>

<body>
    <form action="/index.html" method="GET">
        <div id="otp-container"></div>
        <input type="submit" value="Submit" />
    </form>
</body>

</html>
